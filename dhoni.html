<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS Dhoni - IPL Champion</title>
<style>
:root{--yellow:#f9cd05;--gold:#d4a62a;--ink:#16140f;--ash:#2b2a27;--paper:#f5f2e8}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(circle at 30% 20%,#3a3830,var(--ink) 70%);
  font-family:Georgia,"Times New Roman",serif;color:var(--paper)}
.card{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:48px;align-items:center;
  max-width:960px;width:100%}
.photo{border:4px solid var(--yellow);border-radius:6px;overflow:hidden;
  box-shadow:14px 14px 0 var(--gold);aspect-ratio:3/4}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:clamp(44px,8vw,92px);line-height:.95;color:var(--yellow);letter-spacing:-1px}
h2{font-size:22px;font-weight:normal;font-style:italic;margin:16px 0 24px;color:var(--gold)}
.message{font-size:20px;line-height:1.6;max-width:36ch}
.champion{margin:24px 0 32px;font-size:28px;font-weight:bold;color:var(--yellow)}
button{padding:14px 30px;background:var(--yellow);color:var(--ink);font:bold 18px Georgia,serif;
  border:none;border-radius:4px;cursor:pointer;transition:transform .2s,background .2s}
button:hover{transform:translateY(-3px);background:#ffe14d}
button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
#toast{margin-top:18px;min-height:28px;font-size:20px;color:var(--yellow)}
canvas{position:fixed;inset:0;pointer-events:none}
@media(max-width:720px){.card{grid-template-columns:1fr;gap:32px;text-align:center}
  .message{margin:0 auto}.photo{max-width:340px;margin:0 auto}}
</style>
</head>

  <section>
    <h1>MS Dhoni</h1>
    <h2>Thala for a reason</h2>
    <p class="message">The captain. The legend. The finisher. Calm under pressure, always.</p>
    <p class="champion">🏆 IPL Champion</p>
    <button id="btn">Celebrate Thala 🎉</button>
    <p id="toast" aria-live="polite"></p>
  </section>
</main>
<canvas id="fx"></canvas>
<script>
const cv=document.getElementById('fx'),cx=cv.getContext('2d');
let bits=[],running=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}
size();addEventListener('resize',size);
function burst(){
  const colors=['#f9cd05','#d4a62a','#ffffff','#1d3a8a'];
  for(let i=0;i<140;i++)bits.push({x:innerWidth/2,y:innerHeight/2,
    vx:(Math.random()-.5)*16,vy:Math.random()*-14-2,s:Math.random()*8+4,
    c:colors[i%colors.length],life:120});
  if(!running){running=true;requestAnimationFrame(tick)}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits=bits.filter(b=>b.life>0);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.35;b.life--;
    cx.fillStyle=b.c;cx.fillRect(b.x,b.y,b.s,b.s)});
  if(bits.length)requestAnimationFrame(tick);else running=false;
}
document.getElementById('btn').addEventListener('click',()=>{
  document.getElementById('toast').textContent='Thala! Captain Cool forever 💛';
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)burst();
});
</script>
